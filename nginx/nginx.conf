# ── Core Agents reverse proxy ────────────────────────────────────
# Single entry point: routes API traffic to the backend and everything
# else to the Next.js frontend. Replaces the Next.js /api rewrite so the
# frontend image has no build-time coupling to the backend URL.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream backend_upstream {
    server backend:3001;
  }

  upstream frontend_upstream {
    server frontend:3000;
  }

  server {
    listen 3000;
    server_name _;

    client_max_body_size 25m;

    # ── API → backend ─────────────────────────────────────────────
    # SSE streaming (flow execution, co-pilot chat) must not be buffered.
    location /api/ {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      chunked_transfer_encoding on;
    }

    # ── OpenAI-compatible chat API → backend (streaming too) ──────
    location /v1/ {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      chunked_transfer_encoding on;
    }

    # ── Everything else → frontend ─────────────────────────────────
    location / {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }

    # ── Proxy health check ─────────────────────────────────────────
    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }
  }
}
