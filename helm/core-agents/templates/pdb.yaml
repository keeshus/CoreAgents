# PodDisruptionBudget — ensure the API/frontend/worker stay available
# during voluntary disruptions (node drains, upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "core-agents.fullname" . }}-backend
  labels:
    {{- include "core-agents.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ include "core-agents.fullname" . }}-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "core-agents.fullname" . }}-worker
  labels:
    {{- include "core-agents.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ include "core-agents.fullname" . }}-worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "core-agents.fullname" . }}-frontend
  labels:
    {{- include "core-agents.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ include "core-agents.fullname" . }}-frontend
