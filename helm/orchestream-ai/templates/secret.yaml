{{- if .Values.existingSecret }}
# ── Secret: using pre-existing secret ─────────────────────────────
# Values below are ignored; the referenced Secret must contain the keys:
#   database-url, anthropic-api-key, openai-api-key, valkey-password,
#   sidecar-token
#   (and postgres-password if postgres.enabled=true)
# This is the preferred pattern for production: manage credentials out-of-band.
{{- else }}
# ── Secret: generated from values ─────────────────────────────────
# SECURITY: stringData is stored as base64 in etcd — prefer `existingSecret`
# in production. `dbPassword` is REQUIRED (chart fails to render if unset).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orchestream-ai.secretName" . }}
  labels:
    {{- include "orchestream-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ include "orchestream-ai.databaseUrl" . | quote }}
  anthropic-api-key: {{ .Values.anthropicApiKey | quote }}
  openai-api-key: {{ .Values.openaiApiKey | quote }}
  postgres-password: {{ .Values.dbPassword | required "dbPassword must be set (or provide existingSecret/databaseUrl)" | quote }}
  # Random 32-char password, stable across upgrades (lookup reuses the existing
  # value — decoded from base64 so it is stored as plaintext in stringData)
  valkey-password: {{ $existing := (lookup "v1" "Secret" .Release.Namespace (printf "%s-secret" (include "orchestream-ai.fullname" .))) }}{{ if $existing }}{{ index $existing.data "valkey-password" | b64dec }}{{ else }}{{ .Values.valkey.password | default (randAlphaNum 32) }}{{ end }}
  # Shared secret between backend/worker and the sidecar code-execution sandbox.
  # The sidecar refuses to serve requests without it (sidecar/index.ts).
  sidecar-token: {{ $existing := (lookup "v1" "Secret" .Release.Namespace (printf "%s-secret" (include "orchestream-ai.fullname" .))) }}{{ if $existing }}{{ index $existing.data "sidecar-token" | b64dec }}{{ else }}{{ .Values.sidecar.token | default (randAlphaNum 32) }}{{ end }}
{{- end }}
