{{- if .Values.qdrant.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "orchestream-ai.fullname" . }}-qdrant-pvc
  labels:
    {{- include "orchestream-ai.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.qdrant.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orchestream-ai.fullname" . }}-qdrant
  labels:
    {{- include "orchestream-ai.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 6333
      targetPort: 6333
      name: http
    - port: 6334
      targetPort: 6334
      name: grpc
  selector:
    app: {{ include "orchestream-ai.fullname" . }}-qdrant
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orchestream-ai.fullname" . }}-qdrant
  labels:
    {{- include "orchestream-ai.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "orchestream-ai.fullname" . }}-qdrant
  template:
    metadata:
      labels:
        app: {{ include "orchestream-ai.fullname" . }}-qdrant
    spec:
      # qdrant ships no OS user and starts as root; run as uid 1000 (qdrant's
      # documented non-root uid). fsGroup matches so the PVC is writable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6333
            - containerPort: 6334
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.qdrant.resources | nindent 12 }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "orchestream-ai.fullname" . }}-qdrant-pvc
        - name: tmp
          emptyDir: {}
{{- end }}
