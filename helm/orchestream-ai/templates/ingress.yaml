{{- if .Values.ingress.enabled }}
# TLS is effectively MANDATORY for this ingress: chart render fails if
# ingress.tls is empty. Provide a tls secretName (e.g. cert-manager / Let's Encrypt).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "orchestream-ai.fullname" . }}
  labels:
    {{- include "orchestream-ai.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if eq (len .Values.ingress.tls) 0 }}
  {{- fail "ingress.tls must be configured when ingress.enabled=true — TLS is mandatory (see values.yaml example)" }}
  {{- end }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "orchestream-ai.fullname" $ }}-frontend
                port:
                  number: {{ $.Values.service.frontendPort }}
          {{- end }}
    {{- end }}
{{- end }}
